<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up</title>
    <link rel="shortcut icon" type="image/x-icon" href="/fonts/tabicon.png" />
    <link rel="stylesheet" href="/CSS/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="Assignment3.css">
    
</head>
<body style="background-color:black;">
    
    
    <div class="container">
        
        <div class="row mt-5">
            <div class="col-md-6 col1">
                <img src="/Pics/logo.jpg" alt=""  height="70px" style="margin-top: 200px;">
                <h1  id="sign" style="color:black; ">Welcome!</h1>
                <p   id="sign" style="color: black;">Please create your account</p>
            </div>
            <div class="col-md-6 col2">
                  <h1 style="color: white; text-align: center; margin-top: 60px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Create<span style="color: yellow; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">&nbsp; Account</span></h1>
                  <form action="">
                   
                        <label for="">First Name</label><br>
                        <input type="text" style="width: 500px; background-color: rgb(41, 38, 38); color: wheat;">
                        <br>
                        <label for="">Last Name</label><br>
                        <input type="text" style="width: 500px; background-color: rgb(41, 38, 38); color: wheat;">
                        <br>
                        <label for="">E-mail</label><br>
                        <input type="text" style="width: 500px; background-color: rgb(41, 38, 38); color: wheat;">
                        <br>
                        <label for="">Password</label><br>
                        <input type="password" style="width: 500px; background-color: rgb(41, 38, 38); color: wheat;">
                        <br>
                        <label for="">Confirm Password</label><br>
                        <input type="password" style="width: 500px; background-color: rgb(41, 38, 38); color: wheat;">
                 
                        <div class="form-check text-start my-3">
                        <input  class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault">
                        <label class="form-check-label" for="flexCheckDefault" >
                        Remember me
                        </label>
                     
                    </div>
                    <div class="form-group" style="margin-top: 10px; text-align: center;">
                        <button style="background-color: yellow; color: black;  border-radius: 20px; font-weight: 900; width: 170px;height: 40px; ">Sign-Up</button>
                    
                     </div>
                        <hr style="color: white; margin-top: 20px;" >
                        <p style="text-align: center; color: rgb(197, 192, 192); margin-top: 0px; font-weight: 900;">Sign-Up With</p>
                    <div class="dic">
                        <i class="fa-brands fa-twitter" style="color: aliceblue; font-size: 25px;"></i>
                        <i class="fa-brands fa-linkedin" style="color: #e7e7c7; font-size: 25px; margin-left: 5px;"></i>
                        <i class="fa-brands fa-facebook" style="color: aliceblue; font-size: 25px;margin-left: 5px;"></i>
                        <i class="fa-brands fa-google-plus-g" style="color: #fcfcfc; font-size: 25px;margin-left: 5px;"></i>
                    </div>

                  </form>
            </div>
        </div>
    </div>

</body>
</html>
