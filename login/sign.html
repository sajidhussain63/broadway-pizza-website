<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>sign in</title>

<body style="background-color:black;">
    <div class="container">
        <div class="row mt-5">
            <div class="col-md-6 col1">
                <img src="/Pics/logo.jpg" alt=""  height="70px" style="margin-top: 180px;">
                <h1  id="sign" style="color:black; ">Welcome!</h1>
                <p   id="sign" style="color: black;">If you have account then sign please</p>
            </div>
            <div class="col-md-6 col2">
                  <h1 style="color: white; text-align: center; margin-top: 40px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Sign <span style="color: yellow; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">In</span></h1>
                  <form action="">
                   
                        <label for=""> Name</label><br>
                        <input type="text" style="width: 500px; background-color: rgb(41, 38, 38); color: wheat;">
                        <br>
                        <label for="">E-mail</label><br>
                        <input type="text" style="width: 500px; background-color: rgb(41, 38, 38); color: wheat;">
                        <br>
                        <label for="">Password</label><br>
                        <input type="password" style="width: 500px; background-color: rgb(41, 38, 38); color: wheat;">
                    <div class="form-check text-start my-3">
                        <input  class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault">
                        <label class="form-check-label" for="flexCheckDefault" >
                        Remember me
                        </label>
                        <a href="./assignment2.css" style="color: white; margin-left: 250px;">Forgot password?</a>
                    </div>
                    <div class="form-group" style="margin-top: 40px;">
                        <button style="background-color: yellow; color: black;  border-radius: 20px; width: 170px;height: 40px; font-weight: bolder;">Sign in</button>
                        <a href="login.html" style="color: yellow;  margin-left: 30px; font-size: 21px;">or create account</a>
                     </div>
                        <hr style="color: white; margin-top: 10px;" >

                    <div class="dic">
                        <i class="fa-brands fa-twitter" style="color: aliceblue; font-size: 25px;"></i>
                        <i class="fa-brands fa-linkedin" style="color: #e7e7c7; font-size: 25px; margin-left: 5px;"></i>
                        <i class="fa-brands fa-facebook" style="color: aliceblue; font-size: 25px;margin-left: 5px;"></i>
                        <i class="fa-brands fa-google-plus-g" style="color: #fcfcfc; font-size: 25px;margin-left: 5px;"></i>
                    </div>

                  </form>
            </div>
